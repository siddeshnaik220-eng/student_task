<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Student Task Manager</title>
<style>
/* ── reset & base ─────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;
  --surface:#1a1a2e;
  --panel:#16213e;
  --card:#1e2a45;
  --border:#2d3a5a;
  --primary:#7c3aed;
  --primary-l:#8b5cf6;
  --primary-glow:rgba(124,58,237,.35);
  --accent:#06b6d4;
  --success:#10b981;
  --warn:#f59e0b;
  --danger:#ef4444;
  --text:#e2e8f0;
  --muted:#94a3b8;
  --radius:14px;
  --sidebar:220px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

/* ── layout ───────────────────────────────────────────────────── */
.shell{display:flex;height:100vh;overflow:hidden}

/* ── sidebar ──────────────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:1.5rem 1rem;
  gap:.4rem;
}
.logo{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem 1.5rem;font-weight:700;font-size:1rem;color:#fff}
.logo .icon{font-size:1.5rem}
.nav-item{
  display:flex;align-items:center;gap:.7rem;
  padding:.6rem .75rem;border-radius:10px;
  cursor:pointer;color:var(--muted);
  transition:background .18s,color .18s;font-weight:500;
}
.nav-item:hover{background:rgba(124,58,237,.15);color:var(--text)}
.nav-item.active{background:var(--primary-glow);color:#c4b5fd;border:1px solid rgba(124,58,237,.4)}
.nav-icon{font-size:1.1rem;width:1.3rem;text-align:center}
.sidebar-footer{margin-top:auto;padding:.75rem;font-size:.75rem;color:var(--muted);text-align:center;border-top:1px solid var(--border)}

/* ── main ─────────────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.85rem 1.6rem;
  border-bottom:1px solid var(--border);
  background:var(--panel);
  gap:1rem;flex-shrink:0;
}
.topbar h1{font-size:1.15rem;font-weight:700;color:#fff}
.topbar-right{display:flex;align-items:center;gap:.75rem}

.page{flex:1;overflow-y:auto;padding:1.4rem 1.6rem;display:flex;flex-direction:column;gap:1.2rem}

/* ── stats row ────────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.stat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:1rem 1.1rem;
  display:flex;flex-direction:column;gap:.3rem;
  position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:-30%;right:-10%;
  width:80px;height:80px;border-radius:50%;opacity:.15;
}
.stat-card.total::before{background:var(--primary)}
.stat-card.pending::before{background:var(--warn)}
.stat-card.done-c::before{background:var(--success)}
.stat-card.high::before{background:var(--danger)}
.stat-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat-val{font-size:1.9rem;font-weight:800;line-height:1}
.stat-card.total .stat-val{color:var(--primary-l)}
.stat-card.pending .stat-val{color:var(--warn)}
.stat-card.done-c .stat-val{color:var(--success)}
.stat-card.high .stat-val{color:var(--danger)}
.stat-icon{position:absolute;bottom:.7rem;right:.9rem;font-size:1.6rem;opacity:.4}

/* ── toolbar ──────────────────────────────────────────────────── */
.toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.search-box{
  display:flex;align-items:center;gap:.5rem;
  background:var(--card);border:1px solid var(--border);
  border-radius:9px;padding:.45rem .85rem;flex:1;max-width:300px;
}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:.88rem;width:100%}
.search-box input::placeholder{color:var(--muted)}
select.filter-sel{
  background:var(--card);border:1px solid var(--border);
  color:var(--text);border-radius:9px;padding:.45rem .75rem;
  font-size:.85rem;cursor:pointer;outline:none;
}
select.filter-sel option{background:var(--card)}
.btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.46rem 1rem;border-radius:9px;font-size:.84rem;
  font-weight:600;cursor:pointer;border:none;transition:all .18s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 0 18px var(--primary-glow)}
.btn-primary:hover{background:var(--primary-l)}
.btn-sm{padding:.32rem .7rem;font-size:.78rem}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--card);color:var(--text)}
.btn-danger{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.28)}
.btn-success{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.btn-success:hover{background:rgba(16,185,129,.28)}
.btn-edit-s{background:rgba(124,58,237,.15);color:#c4b5fd;border:1px solid rgba(124,58,237,.3)}
.btn-edit-s:hover{background:rgba(124,58,237,.28)}

/* ── table ────────────────────────────────────────────────────── */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:rgba(255,255,255,.03);border-bottom:1px solid var(--border)}
th{padding:.75rem 1rem;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(124,58,237,.06)}
td{padding:.7rem 1rem;vertical-align:middle}
.task-title-cell{font-weight:600;color:#fff;max-width:220px}
.task-title-cell.done-text{text-decoration:line-through;color:var(--muted);font-weight:400}
.task-desc-cell{color:var(--muted);font-size:.8rem;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id-cell{font-family:monospace;font-size:.75rem;color:var(--muted)}

/* badges */
.badge{display:inline-block;padding:.18rem .55rem;border-radius:99px;font-size:.71rem;font-weight:700;letter-spacing:.03em}
.b-high{background:rgba(239,68,68,.18);color:#fca5a5}
.b-medium{background:rgba(245,158,11,.18);color:#fcd34d}
.b-low{background:rgba(16,185,129,.18);color:#6ee7b7}
.b-done{background:rgba(16,185,129,.18);color:#6ee7b7}
.b-pending{background:rgba(148,163,184,.12);color:#94a3b8}

.actions-cell{display:flex;gap:.4rem;align-items:center}

/* ── empty ────────────────────────────────────────────────────── */
.empty-row td{text-align:center;padding:3rem;color:var(--muted)}
.empty-icon{font-size:2.8rem;display:block;margin-bottom:.5rem}

/* ── modal backdrop ───────────────────────────────────────────── */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);backdrop-filter:blur(4px);
  z-index:200;align-items:center;justify-content:center;
}
.modal-bg.open{display:flex;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.modal{
  background:var(--panel);border:1px solid var(--border);
  border-radius:18px;padding:1.8rem 2rem;
  width:90%;max-width:480px;
  box-shadow:0 24px 80px rgba(0,0,0,.5);
  animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:1.1rem;font-weight:700;margin-bottom:1.3rem;color:#fff}

/* ── form inside modal ────────────────────────────────────────── */
.form-group{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem}
.form-group label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.form-control{
  background:var(--card);border:1px solid var(--border);
  color:var(--text);border-radius:9px;padding:.55rem .85rem;
  font-size:.88rem;font-family:inherit;outline:none;transition:border-color .18s;width:100%;
}
.form-control:focus{border-color:var(--primary)}
textarea.form-control{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.modal-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.3rem}

/* ── confirm modal ────────────────────────────────────────────── */
.confirm-modal{max-width:360px}
.confirm-modal p{font-size:.88rem;color:var(--muted);margin-bottom:1.3rem;line-height:1.5}

/* ── toast ────────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;
  display:flex;flex-direction:column;gap:.5rem;
}
.toast-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:.65rem 1.1rem;font-size:.84rem;
  display:flex;align-items:center;gap:.5rem;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
  animation:slidein .25s ease;min-width:220px;
}
@keyframes slidein{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.toast-item.success{border-color:rgba(16,185,129,.4);color:#6ee7b7}
.toast-item.error{border-color:rgba(239,68,68,.4);color:#fca5a5}

/* ── responsive ───────────────────────────────────────────────── */
@media(max-width:700px){
  .sidebar{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="shell">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="logo"><span class="icon">📚</span>TaskBoard</div>

    <div class="nav-item active" onclick="showView('tasks')">
      <span class="nav-icon">✅</span> My Tasks
    </div>
    <div class="nav-item" onclick="showView('completed')">
      <span class="nav-icon">🏆</span> Completed
    </div>
    <div class="nav-item" onclick="showView('high')">
      <span class="nav-icon">🔥</span> High Priority
    </div>

    <div class="sidebar-footer">Data saved in browser</div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">
    <div class="topbar">
      <h1 id="page-title">All Tasks</h1>
      <div class="topbar-right">
        <button class="btn btn-primary" onclick="openCreate()">＋ New Task</button>
      </div>
    </div>

    <div class="page">

      <!-- Stats -->
      <div class="stats">
        <div class="stat-card total">
          <span class="stat-label">Total</span>
          <span class="stat-val" id="s-total">0</span>
          <span class="stat-icon">📋</span>
        </div>
        <div class="stat-card pending">
          <span class="stat-label">Pending</span>
          <span class="stat-val" id="s-pending">0</span>
          <span class="stat-icon">⏳</span>
        </div>
        <div class="stat-card done-c">
          <span class="stat-label">Completed</span>
          <span class="stat-val" id="s-done">0</span>
          <span class="stat-icon">✅</span>
        </div>
        <div class="stat-card high">
          <span class="stat-label">High Priority</span>
          <span class="stat-val" id="s-high">0</span>
          <span class="stat-icon">🔥</span>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          🔍 <input id="search" placeholder="Search tasks…" oninput="renderTable()"/>
        </div>
        <select class="filter-sel" id="f-priority" onchange="renderTable()">
          <option value="">All Priorities</option>
          <option>High</option><option>Medium</option><option>Low</option>
        </select>
        <select class="filter-sel" id="f-status" onchange="renderTable()">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="done">Completed</option>
        </select>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Description</th>
              <th>Due Date</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="task-tbody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- ── Create / Edit Modal ── -->
<div class="modal-bg" id="form-modal">
  <div class="modal">
    <h2 id="modal-title">New Task</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Title *</label>
        <input class="form-control" id="f-title" maxlength="120" placeholder="e.g. Math Assignment"/>
      </div>
      <div class="form-group">
        <label>Due Date *</label>
        <input class="form-control" id="f-date" type="date"/>
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea class="form-control" id="f-desc" maxlength="500" placeholder="Optional details…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Priority *</label>
        <select class="form-control" id="f-pri">
          <option value="">Select…</option>
          <option>Low</option><option>Medium</option><option>High</option>
        </select>
      </div>
      <div class="form-group" id="status-group" style="display:none">
        <label>Status</label>
        <select class="form-control" id="f-status-field">
          <option value="false">Pending</option>
          <option value="true">Completed</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('form-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<!-- ── Delete Confirm Modal ── -->
<div class="modal-bg" id="del-modal">
  <div class="modal confirm-modal">
    <h2>🗑 Delete Task?</h2>
    <p id="del-msg">This action cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('del-modal')">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Yes, Delete</button>
    </div>
  </div>
</div>

<!-- ── Toast container ── -->
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// Storage
// ══════════════════════════════════════════════════════════
const STORE = 'stm_tasks_v1';

function loadTasks(){
  try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }
  catch(e){ return {}; }
}
function saveTasks(tasks){ localStorage.setItem(STORE, JSON.stringify(tasks)); }

function newId(){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let id='';
  for(let i=0;i<8;i++) id+=chars[Math.floor(Math.random()*chars.length)];
  const tasks=loadTasks();
  return tasks[id] ? newId() : id;   // FR-7: guarantee uniqueness
}

// ══════════════════════════════════════════════════════════
// Validation  (NFR-2)
// ══════════════════════════════════════════════════════════
function validate(title, date, priority){
  if(!title.trim())          return 'Title is required.';
  if(title.length>120)       return `Title too long (${title.length}/120).`;
  if(!date)                  return 'Due date is required.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return 'Use YYYY-MM-DD date format.';
  if(!priority)              return 'Please select a priority.';
  return null;
}

// ══════════════════════════════════════════════════════════
// View filter state
// ══════════════════════════════════════════════════════════
let currentView = 'tasks'; // tasks | completed | high

function showView(v){
  currentView = v;
  const titles = {tasks:'All Tasks', completed:'Completed Tasks', high:'High Priority'};
  document.getElementById('page-title').textContent = titles[v];
  document.querySelectorAll('.nav-item').forEach((el,i)=>{
    el.classList.toggle('active', ['tasks','completed','high'][i]===v);
  });
  // reset search/filter
  document.getElementById('search').value='';
  document.getElementById('f-priority').value='';
  document.getElementById('f-status').value='';
  renderTable();
}

// ══════════════════════════════════════════════════════════
// Stats
// ══════════════════════════════════════════════════════════
function updateStats(){
  const all = Object.values(loadTasks());
  document.getElementById('s-total').textContent   = all.length;
  document.getElementById('s-pending').textContent = all.filter(t=>!t.completed).length;
  document.getElementById('s-done').textContent    = all.filter(t=> t.completed).length;
  document.getElementById('s-high').textContent    = all.filter(t=>t.priority==='High').length;
}

// ══════════════════════════════════════════════════════════
// Table render  (FR-3)
// ══════════════════════════════════════════════════════════
function renderTable(){
  const tasks   = loadTasks();
  const search  = document.getElementById('search').value.toLowerCase();
  const fPri    = document.getElementById('f-priority').value;
  const fStat   = document.getElementById('f-status').value;
  const tbody   = document.getElementById('task-tbody');

  let list = Object.values(tasks);

  // view filter
  if(currentView==='completed') list=list.filter(t=>t.completed);
  if(currentView==='high')      list=list.filter(t=>t.priority==='High');

  // search + dropdowns
  if(search) list=list.filter(t=>
    t.title.toLowerCase().includes(search)||
    (t.description||'').toLowerCase().includes(search)||
    t.id.toLowerCase().includes(search)
  );
  if(fPri)  list=list.filter(t=>t.priority===fPri);
  if(fStat==='done')    list=list.filter(t=>t.completed);
  if(fStat==='pending') list=list.filter(t=>!t.completed);

  // sort: pending first, then by date
  list.sort((a,b)=> a.completed - b.completed || a.due_date.localeCompare(b.due_date));

  if(!list.length){
    tbody.innerHTML=`<tr class="empty-row"><td colspan="7">
      <span class="empty-icon">📭</span>No tasks found.</td></tr>`;
    return;
  }

  const priClass={High:'b-high',Medium:'b-medium',Low:'b-low'};
  tbody.innerHTML = list.map(t=>`
    <tr>
      <td><span class="id-cell">${t.id}</span></td>
      <td><div class="task-title-cell ${t.completed?'done-text':''}">${esc(t.title)}</div></td>
      <td><div class="task-desc-cell">${esc(t.description)||'<em style="opacity:.4">—</em>'}</div></td>
      <td style="color:var(--muted);font-size:.82rem">${t.due_date}</td>
      <td><span class="badge ${priClass[t.priority]}">${t.priority}</span></td>
      <td>
        ${t.completed
          ? '<span class="badge b-done">✔ Done</span>'
          : '<span class="badge b-pending">○ Pending</span>'}
      </td>
      <td>
        <div class="actions-cell">
          <button class="btn btn-sm btn-edit-s" onclick="openEdit('${t.id}')">✏</button>
          <button class="btn btn-sm ${t.completed?'btn-ghost':'btn-success'}"
                  onclick="toggleDone('${t.id}')" title="${t.completed?'Re-open':'Mark done'}">
            ${t.completed?'↩':'✔'}
          </button>
          <button class="btn btn-sm btn-danger" onclick="openDelete('${t.id}')">🗑</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function esc(s){ const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

// ══════════════════════════════════════════════════════════
// Create / Edit  (FR-1, FR-2, FR-4)
// ══════════════════════════════════════════════════════════
let editingId = null;

function openCreate(){
  editingId=null;
  document.getElementById('modal-title').textContent='➕ New Task';
  document.getElementById('f-title').value='';
  document.getElementById('f-date').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-pri').value='';
  document.getElementById('status-group').style.display='none';
  openModal('form-modal');
}

function openEdit(id){
  const task=loadTasks()[id];
  if(!task){ toast('Task not found.','error'); return; } // FR-6
  editingId=id;
  document.getElementById('modal-title').textContent='✏ Edit Task — '+id;
  document.getElementById('f-title').value=task.title;
  document.getElementById('f-date').value=task.due_date;
  document.getElementById('f-desc').value=task.description||'';
  document.getElementById('f-pri').value=task.priority;
  document.getElementById('f-status-field').value=String(task.completed);
  document.getElementById('status-group').style.display='';
  openModal('form-modal');
}

function saveTask(){
  const title = document.getElementById('f-title').value.trim();
  const date  = document.getElementById('f-date').value;
  const desc  = document.getElementById('f-desc').value.trim();
  const pri   = document.getElementById('f-pri').value;

  const err = validate(title,date,pri);
  if(err){ toast(err,'error'); return; }  // NFR-2: validate before write

  const tasks = loadTasks();

  if(editingId){
    // FR-4 / FR-7: update, preserve ID
    const completed = document.getElementById('f-status-field').value==='true';
    tasks[editingId]={...tasks[editingId],title,description:desc,due_date:date,priority:pri,completed};
    saveTasks(tasks);
    toast(`Task ${editingId} updated.`,'success');
  } else {
    // FR-1 / FR-2: create with unique ID
    const id=newId();
    tasks[id]={id,title,description:desc,due_date:date,priority:pri,completed:false};
    saveTasks(tasks);
    toast(`Task created — ID: ${id}`,'success');
  }

  closeModal('form-modal');
  updateStats();
  renderTable();
}

// ══════════════════════════════════════════════════════════
// Toggle completion
// ══════════════════════════════════════════════════════════
function toggleDone(id){
  const tasks=loadTasks();
  if(!tasks[id]){ toast('Task not found.','error'); return; } // FR-6
  tasks[id].completed=!tasks[id].completed;
  saveTasks(tasks);
  updateStats();
  renderTable();
}

// ══════════════════════════════════════════════════════════
// Delete  (FR-5, FR-6, FR-7)
// ══════════════════════════════════════════════════════════
let pendingDeleteId=null;

function openDelete(id){
  const tasks=loadTasks();
  if(!tasks[id]){ toast('Task not found.','error'); return; } // FR-6
  pendingDeleteId=id;
  document.getElementById('del-msg').textContent=
    `Delete "${tasks[id].title}" (ID: ${id})? This cannot be undone.`;
  openModal('del-modal');
}

function confirmDelete(){
  if(!pendingDeleteId) return;
  const tasks=loadTasks();
  if(!tasks[pendingDeleteId]){
    // FR-6: never silently succeed on unknown ID
    toast('Task no longer exists.','error');
    closeModal('del-modal');
    return;
  }
  const id=pendingDeleteId;
  delete tasks[id];         // FR-7: actually remove it
  saveTasks(tasks);
  pendingDeleteId=null;
  closeModal('del-modal');
  toast(`Task ${id} deleted.`,'success');
  updateStats();
  renderTable();
}

// ══════════════════════════════════════════════════════════
// Modal helpers
// ══════════════════════════════════════════════════════════
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

// close on backdrop click
document.querySelectorAll('.modal-bg').forEach(bg=>{
  bg.addEventListener('click',e=>{ if(e.target===bg) bg.classList.remove('open'); });
});

// ══════════════════════════════════════════════════════════
// Toast  (NFR-1)
// ══════════════════════════════════════════════════════════
function toast(msg, type='success'){
  const el=document.createElement('div');
  el.className=`toast-item ${type}`;
  el.textContent=(type==='success'?'✔ ':'✖ ')+msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

// ══════════════════════════════════════════════════════════
// Boot
// ══════════════════════════════════════════════════════════
updateStats();
renderTable();
</script>
</body>
</html>
